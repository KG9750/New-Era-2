recipes:
  - id: recipe.c7_clothing.sew_base_layer
    name: 基础内层衣裤缝制
    description: 将通用织物裁剪缝制为按尺寸管理的基础内层衣裤。
    status: candidate_only
    kind: tailoring
    resource_chains: [survival, politics]
    inputs: [{item: item.material.woven_cloth, amount: 1.2, consumed: true}]
    substitution_policy: {allowed: false, rules: []}
    facilities: [textile_bench]
    tools: [sewing_tools, measuring_tools]
    qualification: {minimum_role: tailor, skill: tailoring, specialty: base_layer, missing_effect: quality_cap_reduced}
    effective_time_hours: {min: 3.0, max: 5.0}
    logistics: {input_staging: 织物按清洁状态和目标尺寸裁片集结。, output_storage: 检查接缝、尺寸和成套状态后按尺码干燥保存。}
    outputs: [{item: item.clothing.base_layer_set, min: 1.0, max: 1.0}]
