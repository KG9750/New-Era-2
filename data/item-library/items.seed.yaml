items:
  - id: item.agriculture.compound_fertilizer
    name: 复合化肥
    description: 提高作物周期产量区间的受控农业投入；若未按时送达农田，库存存在也不会产生效果。
    status: candidate_only
    category: material
    form: bulk_material
    tags: [agricultural_input, chemical, contamination_risk, traceable]
    resource_chains: [survival, politics]
    availability: limited
    legal_profile: controlled
    exposure_profile:
      visibility: medium
      traceability: regulated_batch
      wealth_signal: low
    actions: [apply, reserve, trade, deliver, store]
    unit: bag
    mass: 20.0
    volume: 28.0
    stack_rule:
      stackable: true
      merge_keys: [batch_grade, contamination_state, legal_status]
    storage_rule: [dry, hazardous, away_from_food]
    base_value: 28
    acquisition_paths:
      - type: trade
        note: 从持有农业化学品配额的商队取得，批次来源可被审计。
      - type: mission
        note: 作为农业援助或配额任务交付，通常附带用途承诺。
    consumption_loss_paths:
      - type: consumed_by_recipe
        note: 在混合农田作物周期中按袋施用并从可用库存扣除。
      - type: contaminated
        note: 受潮或与食品混放后转为不可用化学废料负担。
    logistics_note: 必须在播种窗口前送到灌溉农田的危险品暂存点，不能与食品同车厢散放。
    interfaces:
      produced_by: []
      used_by: [recipe.agriculture.mixed_field_crop_cycle]
      repair_recipes: []
      dismantle_recipes: []
    decision_role: 把有限化学品同时连接粮食稳定与受监管的政治承诺，形成早期可解释的库存机会成本。

  - id: item.plant.mixed_crop_seed
    name: 混合作物种子
    description: 适合小型混作田的谷物与蔬菜种源；批次纯度与受潮状态会影响能否合并。
    status: candidate_only
    category: plant_and_seed
    form: bulk_material
    tags: [seed_stock, agricultural_input, food_grade]
    resource_chains: [survival, politics]
    availability: limited
    legal_profile: default_legal
    exposure_profile:
      visibility: low
      traceability: local_markings
      wealth_signal: low
    actions: [sow, reserve, trade, deliver, store]
    unit: packet
    mass: 1.0
    volume: 1.5
    stack_rule:
      stackable: true
      merge_keys: [batch_grade, freshness, contamination_state, ownership]
    storage_rule: [dry, cool, moisture_protected]
    base_value: 18
    acquisition_paths:
      - type: agriculture
        note: 从上一收获周期中保留经筛选的种源，牺牲一部分可食用产出。
      - type: trade
        note: 从邻近聚落交换经过标记的种子批次。
    consumption_loss_paths:
      - type: consumed_by_recipe
        note: 播种后转化为农田中的生长实体，不再属于仓库库存。
      - type: spoiled
        note: 受潮或存放过久后发芽率下降并退出可播种库存。
    logistics_note: 需要在播种前从干燥种子柜送到农田，运输中必须防潮并保持批次标签。
    interfaces:
      produced_by: []
      used_by: [recipe.agriculture.mixed_field_crop_cycle]
      repair_recipes: []
      dismantle_recipes: []
    decision_role: 迫使玩家在当期食用、贸易交付与下期生产能力之间保留种源。

  - id: item.food.raw_grain
    name: 原粮
    description: 可直接进入基础口粮，也可加工为耐储备粮；潮湿与虫害会迅速削弱其储备价值。
    status: candidate_only
    category: food_and_drink
    form: bulk_material
    tags: [edible, food_grade]
    resource_chains: [survival, politics]
    availability: common
    legal_profile: default_legal
    exposure_profile:
      visibility: medium
      traceability: none
      wealth_signal: low
    actions: [consume, cook, reserve, trade, deliver, store]
    unit: kilogram
    mass: 1.0
    volume: 1.4
    stack_rule:
      stackable: true
      merge_keys: [batch_grade, freshness, contamination_state, ownership]
    storage_rule: [dry, food_safe, moisture_protected]
    base_value: 3
    acquisition_paths:
      - type: agriculture
        note: 完成混合农田作物周期后收获并运入粮仓。
      - type: trade
        note: 以标准粮袋从商队或邻邦采购。
    consumption_loss_paths:
      - type: consumed_directly
        note: 经基础烹煮后作为日常饮食消耗。
      - type: consumed_by_recipe
        note: 用于制作耐储备的保存口粮。
      - type: spoiled
        note: 受潮、虫害或污染后转为不可食用损耗。
    logistics_note: 从农田收获点运往干燥粮仓；开袋后应优先使用，避免形成过多新鲜度批次。
    interfaces:
      produced_by: [recipe.agriculture.mixed_field_crop_cycle]
      used_by: [recipe.food.preserved_ration_batch]
      repair_recipes: []
      dismantle_recipes: []
    decision_role: 在日常食用、长期储备、政治交付和下一步食品加工之间形成最基础的粮食分流。

  - id: item.water.clean_water
    name: 洁净水
    description: 饮用、烹饪、清洁和基础化学工艺共享的洁净水；用途不同但必须占用同一可用库存。
    status: candidate_only
    category: food_and_drink
    form: bulk_material
    tags: [potable, food_grade, hygiene]
    resource_chains: [survival, industry, security]
    availability: common
    legal_profile: default_legal
    exposure_profile:
      visibility: low
      traceability: none
      wealth_signal: low
    actions: [consume, cook, clean, reserve, deliver, store]
    unit: liter
    mass: 1.0
    volume: 1.0
    stack_rule:
      stackable: true
      merge_keys: [contamination_state, ownership]
    storage_rule: [food_safe, contamination_controlled]
    base_value: 1
    acquisition_paths:
      - type: manufacture
        note: 由聚落净水设施处理后进入食品级储水容器。
      - type: trade
        note: 以密封水桶采购，交接时检查容器与污染标记。
    consumption_loss_paths:
      - type: consumed_directly
        note: 作为人物日常饮水消耗。
      - type: consumed_by_recipe
        note: 被农业、食品、清洁、消毒或制皂工艺占用。
      - type: contaminated
        note: 容器破损或与化学品混运后退出洁净水库存。
    logistics_note: 水源、食品级容器和工艺暂存桶必须分开记账；运输距离直接占用搬运时间。
    interfaces:
      produced_by: []
      used_by:
        - recipe.agriculture.mixed_field_crop_cycle
        - recipe.food.preserved_ration_batch
        - recipe.chemistry.mix_cleaning_solution
        - recipe.chemistry.prepare_basic_antiseptic
        - recipe.chemistry.make_soap
      repair_recipes: []
      dismantle_recipes: []
    decision_role: 作为五类工艺共用的高频瓶颈，阻止饮水、卫生、医疗和生产各自拥有隐形水源。

  - id: item.food.fresh_vegetable
    name: 新鲜蔬菜
    description: 营养价值较高但容易腐坏的混作田产出，可改善日常饮食或进入保存口粮。
