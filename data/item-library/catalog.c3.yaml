definitions:
  - id: item.seed.specialized_grain_seed
    name: 专业谷物种源
    description: 按播种批次保存的耐储谷物种子，用于建立以原粮为主要收获目标的田块，不代表已种植面积或未来产量。
    status: candidate_only
    category: plant_and_seed
    form: bulk_material
    tags: [agricultural_input, seed_stock, grain_crop]
    resource_chains: [survival, industry, politics]
    availability: common
    legal_profile: default_legal
    exposure_profile: {visibility: low, traceability: local_markings, wealth_signal: low}
    actions: [sow, reserve, trade, deliver, store]
    unit: packet
    mass: 0.8
    volume: 1.0
    stack_rule: {stackable: true, merge_keys: [batch_grade, contamination_state, ownership]}
    storage_rule: [dry, cool, moisture_protected]
    base_value: 12
    acquisition_paths:
      - {type: agriculture, note: 从通过筛选的成熟谷物批次留种并完成干燥和发芽检查。}
      - {type: trade, note: 从农场或商队按来源批次购入。}
    consumption_loss_paths:
      - {type: sown, note: 播种时按田块规模扣除，进入生长实体而非继续留在库存。}
      - {type: spoiled, note: 受潮、虫害或保存过久会降低发芽能力并退出种源库存。}
      - {type: traded_away, note: 作为农业投入出售或交付。}
    logistics_note: 按来源、发芽检查和污染状态分批，播种前送到田块暂存点并防止与食用粮混用。
    interfaces: {produced_by: [], used_by: [], repair_recipes: [], dismantle_recipes: []}
    decision_role: 在直接食用、留种和扩大种植面积之间形成跨周期资源取舍。

  - id: item.seed.fiber_crop_seed
    name: 纤维作物种源
    description: 用于建立纤维作物田的专用种子批次，目标是获得植物纤维而非食品，不自动产生织物或衣物。
    status: candidate_only
    category: plant_and_seed
    form: bulk_material
    tags: [agricultural_input, seed_stock, fiber_crop]
    resource_chains: [survival, industry, security, politics]
    availability: limited
    legal_profile: default_legal
    exposure_profile: {visibility: low, traceability: local_markings, wealth_signal: low}
    actions: [sow, reserve, trade, deliver, store]
    unit: packet
    mass: 0.6
    volume: 0.9
    stack_rule: {stackable: true, merge_keys: [batch_grade, contamination_state, ownership]}
    storage_rule: [dry, cool, moisture_protected]
    base_value: 15
    acquisition_paths:
      - {type: agriculture, note: 从完成成熟周期的纤维作物中留种并筛除霉变批次。}
      - {type: trade, note: 从纺织产区或农业商队购入有来源标记的种源。}
    consumption_loss_paths:
      - {type: sown, note: 播种后转入纤维作物生长周期。}
      - {type: spoiled, note: 受潮或霉变会使种源失去栽培价值。}
      - {type: traded_away, note: 作为稀缺工业农业投入交易。}
    logistics_note: 需要与食用种子分柜保管，并在播种窗口前送到已确认轮作安排的田块。
    interfaces: {produced_by: [], used_by: [], repair_recipes: [], dismantle_recipes: []}
    decision_role: 把有限耕地从当期食品转向织物、医疗和防护材料，形成清晰的生存与工业竞争。

  - id: item.seed.medicinal_herb_seed
    name: 药草种源
    description: 用于建立小规模药草圃的混合种源批次，需要更严格的来源和污染管理，不等于可直接治疗的药品。
    status: candidate_only
    category: plant_and_seed
    form: bulk_material
    tags: [agricultural_input, seed_stock, medicinal_plant, medical]
    resource_chains: [survival, industry, politics]
    availability: limited
    legal_profile: controlled
    exposure_profile: {visibility: low, traceability: local_markings, wealth_signal: medium}
    actions: [sow, reserve, trade, deliver, store]
    unit: packet
    mass: 0.2
    volume: 0.4
    stack_rule: {stackable: true, merge_keys: [batch_grade, contamination_state, ownership]}
    storage_rule: [dry, cool, moisture_protected, contamination_controlled]
    base_value: 24
    acquisition_paths:
      - {type: agriculture, note: 从完成鉴别的药用植株留种并记录来源。}
      - {type: trade, note: 从医师、采集者或专门种植者处受控购入。}
    consumption_loss_paths:
      - {type: sown, note: 播种后进入药草圃生长实体。}
      - {type: contaminated, note: 与未知植物或化学品混放后退出受控药草种源。}
      - {type: traded_away, note: 作为医疗农业投入受控交易。}
    logistics_note: 与普通种子分开密封和标记，播种前由种植者与医疗人员共同确认来源和田块。
    interfaces: {produced_by: [], used_by: [], repair_recipes: [], dismantle_recipes: []}
    decision_role: 用稀缺耕地和鉴别时间换取后续医疗原料，同时保留误种和污染风险。

  - id: item.seed.fodder_crop_seed
    name: 饲料作物种源
    description: 用于建立饲料地的耐粗放种子批次，收获物主要供动物照护，不直接计入人物食品库存。
    status: candidate_only
    category: plant_and_seed
    form: bulk_material
    tags: [agricultural_input, seed_stock, fodder, animal_feed]
    resource_chains: [survival, industry, security]
    availability: common
    legal_profile: default_legal
    exposure_profile: {visibility: low, traceability: none, wealth_signal: low}
    actions: [sow, reserve, trade, deliver, store]
    unit: packet
    mass: 1.0
    volume: 1.4
    stack_rule: {stackable: true, merge_keys: [batch_grade, contamination_state, ownership]}
    storage_rule: [dry, moisture_protected]
    base_value: 10
    acquisition_paths:
      - {type: agriculture, note: 从成熟饲料作物留种并干燥保存。}
      - {type: trade, note: 从畜牧聚落或普通农业商队购入。}
    consumption_loss_paths:
      - {type: sown, note: 播种后转入饲料地生长周期。}
      - {type: spoiled, note: 虫害或受潮使批次不再适合播种。}
      - {type: traded_away, note: 作为畜牧链农业投入交易。}
    logistics_note: 在播种窗口前送往牧地附近田块，防止被误作人物口粮或普通草料直接消耗。
    interfaces: {produced_by: [], used_by: [], repair_recipes: [], dismantle_recipes: []}
    decision_role: 让聚落必须在种人物食品和维持动物能力之间分配土地、水与劳动。

  - id: item.plant.dried_medicinal_herb
    name: 干燥药草
    description: 经鉴别、清理和干燥的药草原料，可进入后续药品或照护工艺，但未经配制不能视为标准治疗剂。
    status: candidate_only
    category: plant_and_seed
    form: bulk_material
    tags: [medicinal_plant, medical, preserved]
    resource_chains: [survival, industry, politics]
    availability: limited
    legal_profile: controlled
    exposure_profile: {visibility: low, traceability: local_markings, wealth_signal: medium}
    actions: [process, reserve, trade, deliver, store]
    unit: bundle
    mass: 0.4
    volume: 1.0
    stack_rule: {stackable: true, merge_keys: [batch_grade, contamination_state, ownership]}
    storage_rule: [dry, cool, light_protected, contamination_controlled]
    base_value: 18
    acquisition_paths:
      - {type: agriculture, note: 从药草圃收获后完成鉴别和低温干燥。}
      - {type: forage, note: 由有经验采集者采得并经医疗人员复核。}
      - {type: trade, note: 从药师或受控商队购入标记批次。}
    consumption_loss_paths:
      - {type: consumed_by_recipe, note: 作为未来药品、敷料或照护配方的原料消耗。}
      - {type: contaminated, note: 受潮、霉变或来源混淆后退出医疗用途。}
      - {type: traded_away, note: 作为有限医疗原料交易。}
    logistics_note: 按物种、来源和干燥日期分批密封，远离化学品与普通饲料。
    interfaces: {produced_by: [], used_by: [], repair_recipes: [], dismantle_recipes: []}
    decision_role: 提供医疗链的可储原料，同时用鉴别、污染和后续配制限制直接万能使用。

  - id: item.animal.feed_bundle
    name: 饲料捆
    description: 由干草、粗粮副料和可识别补充成分组成的标准动物饲料单位，用于安置与持续照护而非生成动物。
    status: candidate_only
    category: daily_supply
    form: bulk_material
    tags: [fodder, animal_feed, preserved]
    resource_chains: [survival, industry, security]
    availability: common
    legal_profile: default_legal
    exposure_profile: {visibility: medium, traceability: none, wealth_signal: low}
    actions: [reserve, trade, deliver, store]
    unit: bundle
    mass: 12.0
    volume: 18.0
    stack_rule: {stackable: true, merge_keys: [freshness, contamination_state, ownership]}
    storage_rule: [dry, ventilated, away_from_food]
    base_value: 9
    acquisition_paths:
      - {type: agriculture, note: 从饲料地收获并干燥打捆。}
      - {type: trade, note: 从农场或畜牧聚落购入标准饲料捆。}
    consumption_loss_paths:
      - {type: consumed_directly, note: 在动物接收和持续照护中按周期消耗。}
      - {type: spoiled, note: 受潮、霉变或虫害后不能继续饲喂。}
      - {type: traded_away, note: 作为畜牧保障物资出售或交付。}
    logistics_note: 体积大且怕潮，应靠近畜棚分批存放，同时与人物食品和药草原料隔离。
    interfaces: {produced_by: [], used_by: [], repair_recipes: [], dismantle_recipes: []}
    decision_role: 把伙伴动物的持续价值连接到土地、仓储、搬运和日常供给，而非无成本被动加成。

  - id: entity.placed.field_bed
    name: 已部署野战床
