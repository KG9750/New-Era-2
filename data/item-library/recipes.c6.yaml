    byproducts: [{type: item, item: item.waste.wood_ash, min: 0.01, max: 0.03}, {type: burden, burden: wastewater, min: 0.1, max: 0.3}]
    risks: [{id: foodborne_illness, condition: 浸泡、炖煮、分餐或温控不合格。, effect: 整批熟食禁止食用。}, {id: late_delivery, condition: 餐食完成时分餐人物或地点未就绪。, effect: 保存窗口缩短并增加浪费。}]

