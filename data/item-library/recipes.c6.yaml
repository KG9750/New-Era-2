recipes:
  - id: recipe.c6_food.dry_fruit
    name: 鲜果切分脱水
    description: 将合格鲜果切分并以受控热源脱水封装，减少腐坏但消耗燃料。
    status: candidate_only
    kind: food_processing
    resource_chains: [survival, security, politics]
    inputs: [{item: item.food.fresh_fruit, amount: 1.0, consumed: true}, {item: item.material.dry_firewood, amount: 0.12, consumed: true}]
    substitution_policy: {allowed: false, rules: []}
    facilities: [food_preservation_station, basic_kitchen]
    tools: [preservation_tools, cooking_set]
    qualification: {minimum_role: cook, skill: cooking, specialty: fruit_drying, missing_effect: quality_cap_reduced}
    effective_time_hours: {min: 4.0, max: 7.0}
    logistics: {input_staging: 鲜果按成熟和损伤状态送入食品区。, output_storage: 完全冷却后防潮封装并标记加工批次。}
    outputs: [{item: item.food.dried_fruit, min: 0.2, max: 0.35}]
    byproducts: [{type: burden, burden: wastewater, min: 0.1, max: 0.3}]
    risks: [{id: spoilage, condition: 脱水不足或冷却后吸湿。, effect: 包装内霉变并损失批次。}, {id: fire, condition: 热源和干燥材料隔离不合格。, effect: 工艺中止并产生火灾风险。}]

  - id: recipe.c6_food.cook_bean_root_stew
    name: 豆根公共炖食
    description: 将干豆、根菜、水和盐以柴薪炖煮为需要及时分餐的熟食。
    status: candidate_only
    kind: food_processing
    resource_chains: [survival, politics]
    inputs: [{item: item.food.dried_legume, amount: 0.4, consumed: true}, {item: item.food.root_vegetable, amount: 0.4, consumed: true}, {item: item.water.clean_water, amount: 1.0, consumed: true}, {item: item.chemical.mineral_salt, amount: 0.01, consumed: true}, {item: item.material.dry_firewood, amount: 0.15, consumed: true}]
    substitution_policy: {allowed: false, rules: []}
    facilities: [basic_kitchen]
    tools: [cooking_set, measuring_tools]
    qualification: {minimum_role: cook, skill: cooking, specialty: communal_cooking, missing_effect: failure_risk_increased}
    effective_time_hours: {min: 3.0, max: 5.0}
    logistics: {input_staging: 干豆提前浸泡并与根菜、盐、水和燃料同批集结。, output_storage: 熟食按烹制时段分装并立即分餐或冷藏。}
