      target_consumed: true
    inputs: []
    substitution_policy: {allowed: false, rules: []}
    facilities: [archive_desk, electrical_bench]
    tools: [data_recovery_tools, electrical_testing_tools]
    qualification:
      minimum_role: archivist
      skill: archival
      specialty: data_recovery
      missing_effect: prohibited
    effective_time_hours: {min: 2.0, max: 4.0}
    logistics:
      input_staging: 原盘先完成数据价值、所有权和证据状态确认，再进入隔离拆解位。
      output_storage: 电子件与铜线通过离线测试后入库，介质残片进入受控销毁负担。
